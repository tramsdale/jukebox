service: jukebox-app

provider:
  name: aws
  runtime: python3.11
  region: eu-west-2
  stage: ${opt:stage, 'prod'}
  timeout: 30
  memorySize: 512
  
  apiGateway:
    binaryMediaTypes:
      - 'application/pdf'
      - 'application/octet-stream'
      - 'multipart/form-data'
  
  environment:
    FLASK_ENV: production
    DYNAMODB_TABLE: jukebox-records-${self:provider.stage}
    SECRET_KEY: ${env:SECRET_KEY, ''}
    SPOTIFY_CLIENT_ID: ${env:SPOTIFY_CLIENT_ID, ''}
    SPOTIFY_CLIENT_SECRET: ${env:SPOTIFY_CLIENT_SECRET, ''}
    
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:BatchGetItem
      Resource: 
        - "arn:aws:dynamodb:${self:provider.region}:*:table/jukebox-records-${self:provider.stage}"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/jukebox-records-${self:provider.stage}/index/*"
    - Effect: Allow
      Action:
        - s3:GetObject
        - s3:PutObject
      Resource: "arn:aws:s3:::jukebox-static-files-${self:provider.stage}/*"

functions:
  app:
    handler: lambda_function.lambda_handler
    events:
      - http:
          path: /
          method: ANY
          cors: true
      - http:
          path: /{proxy+}
          method: ANY
          cors: true

plugins:
  - serverless-python-requirements
  - serverless-wsgi
  - serverless-domain-manager

custom:
  pythonRequirements:
    dockerizePip: true
    pipCmdExtraArgs:
      - --no-cache-dir
    slim: true
    strip: false
    
  wsgi:
    app: app.app
    
  customDomain:
    domainName: jukebox.tcla.me
    stage: ${self:provider.stage}
    certificateArn: 'arn:aws:acm:eu-west-2:758655430746:certificate/45bc97b7-a6c6-41e4-875e-0278c819002a'
    createRoute53Record: true
    endpointType: 'regional'
    securityPolicy: tls_1_2
    apiType: rest

package:
  patterns:
    - '!tests/**'
    - '!.pytest_cache/**'
    - '!htmlcov/**'
    - '!.coverage'
    - '!README.md'
    - '!.git/**'
    - '!.venv/**'
    - '!node_modules/**'
    - '!.serverless/**'
    - 'templates/**'
    - 'config/**'
    - 'static/**'
    - 'hashed_passwords.py'

resources:
  Resources:
    JukeboxTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: jukebox-records-${self:provider.stage}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: status
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        GlobalSecondaryIndexes:
          - IndexName: StatusIndex
            KeySchema:
              - AttributeName: status
                KeyType: HASH
            Projection:
              ProjectionType: ALL
    
    StaticFilesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: jukebox-static-files-${self:provider.stage}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true