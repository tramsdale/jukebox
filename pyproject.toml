[project]
name = "jukebox-label-generator"
version = "0.1.0"
description = "Generate PDF juke box labels with configurable backgrounds"
readme = "README.md"
requires-python = ">=3.8.1"
dependencies = [
    "reportlab>=4.0.7",
    "pillow>=10.1.0",
    "pyyaml>=6.0.1",
    "flask>=3.0.0",
    "werkzeug>=3.0.0",
    "sqlalchemy>=2.0.0",
    "flask-sqlalchemy>=3.0.0",
    "pymysql>=1.1.0",
    "flask-migrate>=4.0.0",
    "flask-login>=0.6.3",
    "pytest>=8.3.5",
    "pytest-flask>=1.3.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
jukebox-labels = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = [
    "*.py",
    "config/",
    "data/",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]
